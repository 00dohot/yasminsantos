<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Instagram | Yasmin Santos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="instagram-page">
  <main class="ig-shell">
    <header class="ig-top"><a href="../">Voltar ao site</a><strong>@yasminsantos</strong><span></span></header>
    <section class="ig-profile">
      <img class="ig-avatar" src="../assets/images/modelo-piscina.png" alt="">
      <div class="ig-profile-main">
        <div class="ig-name-row"><h1>@yasminsantos</h1><span class="ig-verified">✓</span></div>
        <div class="ig-stats"><div><strong>12</strong><span>publicações</span></div><div><strong>12,8 mil</strong><span>seguidores</span></div><div><strong>184</strong><span>seguindo</span></div></div>
        <p><strong>Criadora de Conteúdo 18+</strong><br>Só para quem sabe o que quer.</p>
      </div>
    </section>

    <section class="ig-highlights">
      <button data-story="Grupo VIP"><span><img src="../assets/images/modelo-piscina.png" alt=""></span><small>Grupo VIP</small></button>
      <button data-story="Prévias"><span><img src="../assets/images/modelo-piscina.png" alt=""></span><small>Prévias</small></button>
      <button data-story="Me"><span><img src="../assets/images/modelo-piscina.png" alt=""></span><small>Me</small></button>
    </section>

    <div class="ig-tabs"><span>▦ PUBLICAÇÕES</span><span>♡ MARCADOS</span></div>
    <section class="ig-publications" id="igPublications"></section>
  </main>

  <div class="story-modal" id="storyModal" aria-hidden="true">
    <div class="modal-bg" data-close-story></div>
    <article class="story-frame">
      <div class="story-line"><span></span></div>
      <button data-close-story>×</button>
      <img src="../assets/images/modelo-piscina.png" alt="">
      <strong id="storyTitle">Grupo VIP</strong>
    </article>
  </div>

  <div class="post-modal" id="postModal" aria-hidden="true">
    <div class="modal-bg" data-close-post></div>
    <article class="post-dialog">
      <button class="post-close" data-close-post>×</button>
      <div class="post-image"><button id="postPrev">‹</button><img id="postImage" src="" alt=""><button id="postNext">›</button></div>
      <aside class="post-side">
        <header><img src="../assets/images/modelo-piscina.png" alt=""><strong>@yasminsantos</strong></header>
        <div class="post-comments" id="postComments"></div>
        <div class="post-actions">
          <button id="likePost" aria-pressed="false">♡</button>
          <button id="focusComment">○</button>
          <button id="sharePost">↗</button>
          <button id="savePost" aria-pressed="false">◇</button>
        </div>
        <strong class="like-count"><span id="likeCount">184</span> curtidas</strong>
        <form id="postCommentForm">
          <input id="commentHandle" placeholder="@seuarroba" required>
          <input id="commentText" placeholder="Adicione um comentário..." required>
          <button>Publicar</button>
        </form>
      </aside>
    </article>
  </div>

  <script src="../config.js"></script>
  <script src="../script.js"></script>
</body>
</html>

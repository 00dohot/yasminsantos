<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="no-referrer" name="referrer"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Ativar acesso</title>
<link href="../assets/css/portal-v13.6.css" rel="stylesheet"/>
</head>
<body>
<main class="portal-login">
<section class="portal-card portal-stack">
<h1 class="portal-title">Seu acesso</h1>
<p class="portal-note" id="activation-status">Consultando o pagamento…</p>
<div class="portal-message" id="portal-message"></div>
<div class="portal-stack portal-hidden" id="activation-actions">
<button class="portal-button" id="activation-telegram">Entrar no Telegram VIP</button>
<div class="portal-divider"></div>
<h2>Criar conta de assinante</h2>
<p class="portal-note">A conta só pode ser criada depois da confirmação do pagamento.</p>
<form class="portal-stack" id="activation-account-form">
<label class="portal-label">Crie sua senha
            <input autocomplete="new-password" class="portal-input" id="activation-password" minlength="8" required="" type="password"/>
</label>
<button class="portal-button" type="submit">Criar conta e acessar conteúdos</button>
</form>
<p class="portal-note">Use maiúscula, minúscula, número e caractere especial.</p>
</div>
</section>
</main>
<script src="../assets/js/app-config-v13.6.js"></script>
<script src="../assets/js/turnstile-v17.6.js?v=17.6"></script>
<script src="../assets/js/payment-recovery-v13.6.js?v=17.6"></script>
<script>
    const statusText = document.getElementById('activation-status');
    const actions = document.getElementById('activation-actions');
    const message = document.getElementById('portal-message');
    function showMessage(text, error = false) {
      message.textContent = text;
      message.style.borderColor = error ? '#ef4444' : '#22c55e';
      message.classList.add('show');
    }
    async function check() {
      YasminPaymentRecovery.bootstrapFromUrl();
      const saved = YasminPaymentRecovery.loadPayment();
      if (!saved) {
        statusText.textContent = 'Não encontramos um pagamento salvo neste navegador.';
        showMessage('Volte ao checkout ou entre em contato com o suporte.', true);
        return;
      }
      try {
        const data = await YasminPaymentRecovery.status();
        if (data.pagamentoConfirmado && data.autorizado) {
          statusText.textContent = 'Pagamento confirmado. Seu acesso está disponível.';
          document.getElementById('activation-telegram').hidden = data.produto !== 'privacy';
          actions.classList.remove('portal-hidden');
          return;
        }
        statusText.textContent = 'Aguardando confirmação do pagamento…';
        setTimeout(check, 10000);
      } catch (error) {
        showMessage(error.message || 'Falha ao consultar o pagamento.', true);
      }
    }
    document.getElementById('activation-telegram').addEventListener('click', async () => {
      try { await YasminPaymentRecovery.telegram(); } catch (error) { showMessage(error.message, true); }
    });
    document.getElementById('activation-account-form').addEventListener('submit', async event => {
      event.preventDefault();
      try { await YasminPaymentRecovery.createAccount(document.getElementById('activation-password').value, event.currentTarget); }
      catch (error) { showMessage(error.message, true); }
    });
    window.YasminTurnstile?.mount("#activation-account-form", "account_create");
    check();
  </script>
<script defer="" src="../assets/js/p16.js"></script>
<script src="../assets/js/admin-editor-v17.js?v=17.6"></script></body>
</html>
